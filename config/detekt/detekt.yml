# Builds on detekt's default config (buildUponDefaultConfig = true); only overrides live here.
# Overrides are Compose-specific: @Composable functions are PascalCase, take many
# defaulted parameters, and carry dp/sp literals that are design tokens, not magic numbers.

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Za-z0-9]*'
  # Navigation files group a feature's @Serializable route with its NavGraphBuilder extension.
  MatchingDeclarationName:
    active: false

complexity:
  LongMethod:
    ignoreAnnotated: ['Composable']
  LongParameterList:
    ignoreDefaultParameters: true
    # Composables take many defaulted parameters; DI constructors list their dependencies.
    ignoreAnnotated: ['Composable', 'Inject', 'AssistedInject']
  # Repository and DAO interfaces mirror the operations of one aggregate.
  TooManyFunctions:
    thresholdInInterfaces: 20
    thresholdInClasses: 20

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Composable', 'Preview']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ReturnCount:
    max: 3
    excludeGuardClauses: true
