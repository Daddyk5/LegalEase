name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: legal
    attributes:
      label: Legal basis (if it affects analysis or templates)
      description: The Civil Code articles or other Philippine law involved, and who reviewed the legal content.
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: The change keeps documents and analysis on the device, or explains why it cannot.
        - label: The change uses existing design-system components and theme tokens.
