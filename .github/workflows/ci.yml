# Checks every pull request and every push to main. Branch protection should require all jobs
# here plus "Dependency security / review" (see CONTRIBUTING.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Build, lint, unit tests, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6

      # The real google-services.json is never in git. These checks only need a file of the right
      # shape, so the placeholder is used and no secret is exposed to pull requests.
      - name: Use placeholder Firebase config
        run: cp app/google-services.json.example app/google-services.json

      - name: Build, lint, detekt (incl. ktlint), unit tests
        run: ./gradlew assembleDebug lint detekt testDebugUnitTest --continue

      - name: Coverage gate (at least 70% on core:domain and core:ml)
        run: ./gradlew :core:domain:koverVerify :core:ml:koverVerifyDebug

      - name: Compile instrumented tests
        run: ./gradlew assembleDebugAndroidTest

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14

  firebase-rules:
    name: Firestore and Storage rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6 # The emulators run on the JVM.
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase-tests/package-lock.json
      - run: npm install -g firebase-tools
      - name: Rules tests (demo project, emulators only)
        working-directory: firebase-tests
        run: |
          npm ci
          npm test

  functions:
    name: Cloud Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - working-directory: functions
        run: |
          npm ci
          npm test
