# Builds a signed release bundle when a version tag (v1.2.3) is pushed, and keeps it and the R8
# mapping file as workflow artifacts. If PLAY_SERVICE_ACCOUNT_JSON is set, it also uploads the
# bundle to the Play Console internal testing track. Secrets are listed in SETUP.md §10d.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  bundle:
    name: Signed release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Secrets live in the "release" environment, so they can require an approver and are never
    # available to pull-request workflows.
    environment: release
    env:
      LEGALEASE_KEYSTORE_PASSWORD: ${{ secrets.LEGALEASE_KEYSTORE_PASSWORD }}
      LEGALEASE_KEY_ALIAS: ${{ secrets.LEGALEASE_KEY_ALIAS }}
      LEGALEASE_KEY_PASSWORD: ${{ secrets.LEGALEASE_KEY_PASSWORD }}
      # Increases with every run of this workflow, which Play requires.
      VERSION_CODE: ${{ github.run_number }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Write Firebase config and keystore
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          for name in GOOGLE_SERVICES_JSON RELEASE_KEYSTORE_BASE64 LEGALEASE_KEYSTORE_PASSWORD LEGALEASE_KEY_ALIAS LEGALEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set (SETUP.md §10d)"; exit 1; fi
          done
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "LEGALEASE_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # The on-device model files are not in git, so llm_pack ships empty from CI; installs then
      # download the model once from Cloud Storage (SETUP.md §7b).
      - name: Build signed bundle
        run: ./gradlew :app:bundleRelease

      - name: Verify the bundle is signed
        # jarsigner exits 0 even for an unsigned file, so check its verdict.
        run: jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tee /dev/stderr | grep -q "jar verified"

      - uses: actions/upload-artifact@v7
        with:
          name: legalease-${{ github.ref_name }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Upload to Play internal testing
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play.json"
          PLAY_SERVICE_ACCOUNT_JSON_PATH="$RUNNER_TEMP/play.json" ./gradlew :app:publishReleaseBundle

      - name: Remove secrets from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/play.json" app/google-services.json
